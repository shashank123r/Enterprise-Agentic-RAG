[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Enterprise Agentic RAG Platform — production-grade retrieval-augmented generation system"
requires-python = ">=3.13"
authors = [{ name = "Enterprise RAG Team" }]
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "redis[hiredis]>=5.2.0",
    "redis-om>=0.3.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    "orjson>=3.10.0",
    "pydantic-extra-types>=2.9.0",
    "python-dotenv>=1.0.1",
    "tenacity>=9.0.0",
    "pypdf>=5.0.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "python-magic>=0.4.27",
    "langdetect>=1.0.9",
    "pillow>=11.0.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "beautifulsoup4>=4.12.0",
    "markdown>=3.7.0",
    "blake3>=1.0.0",
    "pymilvus>=2.5.0",
]

[project.optional-dependencies]
arq = [
    "arq>=7.7.0",
]

dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.7.0",
    "black>=24.10.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "factory-boy>=3.3.0",
    "asyncpg-stubs>=0.30.0",
    "types-python-jose>=3.3.4",
    "types-redis>=4.6.0",
    "types-python-dateutil>=2.9.0",
]

[tool.setuptools.packages.find]
where = ["app"]

[tool.black]
line-length = 100
target-version = ["py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | \.venv
  | alembic
)/
'''

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "RUF", # ruff-specific
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TID", # tidy imports
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
    "RET", # flake8-return
    "SLF", # flake8-self
    "PL",  # pylint
]
ignore = [
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value comparison
    "E501",    # Line length (black handles this)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "SLF001"]
"alembic/**" = ["ALL"]

[tool.mypy]
python_version = "3.13"
strict = true
pretty = true
show_error_codes = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
disallow_any_expr = false
disallow_any_decorated = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "alembic.*",
    "tests.*",
]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=app --cov-report=term-missing --cov-report=html --tb=short"
filterwarnings = [
    "error",
    'ignore::DeprecationWarning:alembic.*',
    'ignore::DeprecationWarning:pkg_resources',
]

[tool.coverage.run]
source = ["app"]
omit = [
    "**/__init__.py",
    "**/conftest.py",
    "**/alembic/**",
    "**/tests/**",
]
